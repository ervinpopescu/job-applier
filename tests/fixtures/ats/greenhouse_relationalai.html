<!doctype html>
<html><body>
<form id="application_form">
  <label for="first_name">First Name*</label><input id="first_name" autocomplete="given-name" required>
  <label for="last_name">Last Name*</label><input id="last_name" autocomplete="family-name" required>
  <label for="email">Email*</label><input id="email" autocomplete="email" required>
  <label for="resume">Resume/CV*</label><input id="resume" type="file">
  <label for="cover_letter">Cover Letter</label><input id="cover_letter" type="file">
  <label for="question_linkedin">LinkedIn Profile</label><input id="question_linkedin" aria-label="LinkedIn Profile">
  <label for="question_website">Website</label><input id="question_website" aria-label="Website">
  <input id="submit_app" type="submit" value="Submit Application">
</form>
</body></html>
